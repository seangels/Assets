      function gasJsonp(params) {
        return new Promise((resolve, reject) => {
          const cb = "cb_" + Math.random().toString(36).slice(2);
          params.callback = cb;

          const qs = new URLSearchParams(params).toString();
          const s = document.createElement("script");
          s.src = API_URL + "?" + qs;

          window[cb] = (resp) => {
            cleanup();
            if (resp && resp.ok) resolve(resp.result);
            else reject(resp?.error || "Unknown error");
          };

          s.onerror = (e) => {
            cleanup();
            reject({ message: "Network error", event: e });
          };

          function cleanup() {
            delete window[cb];
            s.remove();
          }

          document.body.appendChild(s);
        });
      }

      };
      let mockDataPromise = null;

      async function loadMockOrderData() {
        if (mockDataPromise) {
          return mockDataPromise;
        }
        mockDataPromise = fetch(MOCK_DATA_URL, { cache: "no-cache" })
          .then((resp) => (resp.ok ? resp.json() : null))
          .then((json) => {
            if (!json) return null;
            mockState.orderMasters = (json.orderMasters || []).map((item) => ({ ...item }));
            mockState.orderDetails = (json.orderDetails || []).map((item) => ({ ...item }));
            mockState.changeRequests = (json.changeRequests || []).map((item) => ({ ...item }));
            mockState.changeRequestBasics = (json.changeRequestBasics || []).map((item) => ({ ...item }));
            mockState.phieuNhaps = (json.phieuNhaps || []).map((item) => ({ ...item }));
            mockState.phieuXuats = (json.phieuXuats || []).map((item) => ({ ...item }));
            mockState.hangHoas = (json.hangHoas || []).map((item) => ({ ...item }));
            mockState.sanPhams = (json.sanPhams || []).map((item) => ({ ...item }));
            mockState.khos = (json.khos || []).map((item) => ({ ...item }));
            mockState.lienHes = (json.lienHes || []).map((item) => ({ ...item }));
            mockState.khachHangs = (json.khachHangs || []).map((item) => ({ ...item }));
            mockState.dvVanChuyens = (json.dvVanChuyens || []).map((item) => ({ ...item }));
            mockState.statusChanges = (json.statusChanges || []).map((item) => ({ ...item }));
            mockState.prepareCRs = (json.prepareCRs || []).map((item) => ({ ...item }));
            mockState.contextKeys = (json.contextKeys || []).map((item) => ({ ...item }));
            mockState.formConfigs = (json.formConfigs || []).map((item) => ({ ...item }));
            return mockState;
          })
          .catch((error) => {
            console.warn("Cannot load mock order data", error);
            return null;
          });
        return mockDataPromise;
      }

      function getNextId(prefix, collection) {
        const max = collection.reduce((maxValue, item) => {
          const match = String(item?.id || "").match(/(\d+)$/);
          const current = match ? parseInt(match[1], 10) : 0;
          return Math.max(maxValue, current);
        }, 0);
        const next = (max || 0) + 1;
        return `${prefix}${next.toString().padStart(3, "0")}`;
      }
      function delay(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }
      async function tryHandleMockApi(functionName, payload = {}) {
        const data = await loadMockOrderData();
        if (!data) {
          return undefined;
        }
        const clone = (obj) => JSON.parse(JSON.stringify(obj));
        switch (functionName) {
          case "getAllData":
            return { data: clone(data.orderMasters) };
          case "getAllData_ChangeRequest":
            return { data: clone(data.changeRequests) };
          case "Rpc.rpc_getAllData_ChangeRequestBasic":
            await delay(3000);
            return { data: clone(data.changeRequestBasics) };
          case "Rpc.rpc_getLookupOptions":
            await delay(1000);
            return { data: clone(data[payload.contextKey]) };
          case "getById_phieuNhaps": {
            const filtered = payload?.id ? data.phieuNhaps.find((item) => item.id === payload?.id) : null;
            return { data: filtered ? clone(filtered) : null };
          }
          case "getById_phieuXuats": {
            const filtered = payload?.id ? data.phieuXuats.find((item) => item.id === payload?.id) : null;
            return { data: filtered ? clone(filtered) : null };
          }
          case "getAllData_statusHistoriesByChangeRequestId": {
            const filtered = payload?.changeRequestId ? data.statusChanges.find((item) => item.changeRequestId === payload?.changeRequestId) : null;
            return { data: filtered ? clone(filtered) : null };
          }
          case "Rpc.rpc_getPrepareDataForChangeRequest": {
            console.log("Rpc.rpc_getPrepareDataForChangeRequest");
            await delay(3000);
            const { contextKey } = payload;
            const recordId = payload?.recordId;

            if (recordId) {
              const filtered = data.prepareCRs.find((item) => item.contextKey === contextKey && item.objectIdsString === recordId);
              cloneFiltered = filtered ? clone(filtered) : null;
            } else {
              const filtered = data.prepareCRs.find((item) => item.contextKey === contextKey);
              cloneFiltered = filtered ? clone(filtered) : null;
              if (cloneFiltered) cloneFiltered.originalData = {};
            }
            const formItems = data.formConfigs.find((item) => cloneFiltered && item.id === contextKey)?.formItems;
            // get user changed data
            const changeRequestId = payload?.changeRequestId;
            if (changeRequestId) {
              const editData = data.changeRequestBasics.find((item) => item.id === changeRequestId);
              if (!editData) {
                throw new Error(`Can't found changeRequestId: ${changeRequestId}`);
              }
              if (editData.contextKey !== contextKey) {
                throw new Error(`Diff contextKey: editData: ${editData.contextKey} - params:${contextKey}`);
              }
              cloneFiltered = cloneFiltered ? { ...cloneFiltered, changedData: editData.changedData } : editData;
            }
            console.log({
              cloneFiltered,
            });
            return { ok: true, data: cloneFiltered ? { ...cloneFiltered, formItems } : null };
          }
          case "listPhieuXuat":
            return { data: clone(data.phieuXuats) };
          case "createData": {
            const values = { ...(payload?.values || {}) };
            if (!values.id) {
              values.id = getNextId("OM-", data.orderMasters);
            }
            data.orderMasters.push({ ...values });
            return { ok: true, data: clone(values) };
          }
          case "createData_ChangeRequest": {
            const values = { ...(payload?.values || {}) };
            if (!values.id) {
              values.id = getNextId("CR-", data.changeRequests);
            }
            if (!Array.isArray(values.statusChanges)) {
              values.statusChanges = [];
            }
            data.changeRequests.push({ ...values });
            return { ok: true, data: clone(values) };
          }
          case "Rpc.rpc_createData_ChangeRequestBasic": {
            await delay(3000);
            const values = { ...(payload?.values || {}) };
            if (!values.id) {
              values.id = getNextId("CRB-", data.changeRequestBasics);
            }
            data.changeRequestBasics.push({ ...values });
            return { ok: false, data: clone(values) };
          }
          case "updateData": {
            const dataset = payload?.dataset;
            const key = payload?.key || payload?.id || payload?.values?.id;
            if (!key) return { ok: false };
            let collection;
            if (dataset === "dsOrderDetail") {
              collection = data.orderDetails;
            } else if (dataset === "phieuNhap") {
              collection = data.phieuNhaps;
            } else if (dataset === "phieuXuat") {
              collection = data.phieuXuats;
            } else {
              collection = data.orderMasters;
            }
            const index = collection.findIndex((item) => item.id === key);
            if (index === -1) return { ok: false };
            const updated = { ...collection[index], ...(payload?.values || {}) };
            collection[index] = updated;
            return { ok: true, data: clone(updated) };
          }
          case "updateData_ChangeRequest": {
            const key = payload?.key || payload?.id || payload?.values?.id;
            if (!key) return { ok: false };
            const index = data.changeRequests.findIndex((item) => item.id === key);
            if (index === -1) return { ok: false };
            const updated = { ...data.changeRequests[index], ...(payload?.values || {}) };
            data.changeRequests[index] = updated;
            return { ok: true, data: clone(updated) };
          }
          case "Rpc.rpc_updateData_ChangeRequestBasic": {
            await delay(500);
            const key = payload?.key || payload?.id || payload?.values?.id;
            if (!key) return { ok: false };
            const index = data.changeRequestBasics.findIndex((item) => item.id === key);
            if (index === -1) return { ok: false };
            const updated = { ...data.changeRequestBasics[index], ...(payload?.values || {}) };
            data.changeRequestBasics[index] = updated;
            return { ok: true, data: clone(updated) };
          }
          case "softDeleteData": {
            const dataset = payload?.dataset;
            const key = payload?.key;
            if (!key) return { ok: false };
            if (dataset === "dsOrderDetail") {
              data.orderDetails = data.orderDetails.filter((item) => item.id !== key);
            } else {
              data.orderMasters = data.orderMasters.filter((item) => item.id !== key);
            }
            return { ok: true };
          }
          case "deleteData_ChangeRequestBasic": {
            const key = payload?.key || payload?.id;
            if (!key) return { ok: false };
            data.changeRequestBasics = data.changeRequestBasics.filter((item) => item.id !== key);
            return { ok: true };
          }
          case "list": {
            const page = Number(payload?.page || 1);
            const pageSize = Number(payload?.pageSize || 10);
            const start = (page - 1) * pageSize;
            const items = data.orderDetails.slice(start, start + pageSize);
            return {
              items: clone(items),
              total: data.orderDetails.length,
            };
          }
          case "create": {
            const raw = payload?.data;
            const value = typeof raw === "string" ? JSON.parse(raw) : raw || {};
            value.id = getNextId("OD-", data.orderDetails);
            data.orderDetails.push({ ...value });
            return { ok: true, data: clone(value) };
          }
          case "listOrderDetailsByMaster":
          case "listOrderDetails": {
            const masterId = payload?.orderMasterId || payload?.OrderMasterID;
            const filtered = masterId ? data.orderDetails.filter((item) => item.OrderMasterID === masterId) : data.orderDetails;
            return {
              items: clone(filtered),
              total: filtered.length,
            };
          }
          default:
            return undefined;
        }
      }

      async function wrapperApi(action, payload) {
        const loginRes = await gasJsonp({ action: "login", accessCode: "dvit@123" });
        const token = loginRes.sessionToken;
        const payload_ = Object.assign(
          {
            action,
            sessionToken: token,
          },
          payload,
        );

        const result = await gasJsonp(payload_);
        console.log(result);
        return result;
      }
      window._appScriptApi = function (functionName, payload) {
        return tryHandleMockApi(functionName, payload)
          .then((mockResult) => {
            if (mockResult !== undefined) {
              console.log(`[mock-api] ${functionName}`, {
                payload,
                mockResult,
              });
              return mockResult;
            }
            return wrapperApi(functionName, payload);
          })
          .catch((error) => {
            console.warn("Mock API failed, falling back to remote API", error);
            return wrapperApi(functionName, payload);
          });
      };
