<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Quản lý báo giá</title>
    <base href="./">    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preload" href="assets/mocks/bao-gia-master.mock.json" as="fetch" crossorigin="anonymous" />
    <script>
      (function setupLocalPreview(global) {
        if (typeof global._appScriptApi === "function") {
          return;
        }

        var mockDataUrl = "assets/mocks/bao-gia-master.mock.json";
        var statePromise;

        function clone(value) {
          return JSON.parse(JSON.stringify(value));
        }

        function loadState() {
          if (!statePromise) {
            statePromise = fetch(mockDataUrl, { cache: "no-cache" })
              .then(function (response) {
                if (!response.ok) {
                  throw new Error("Không thể tải dữ liệu mẫu");
                }
                return response.json();
              })
              .then(function (json) {
                return {
                  customers: clone(json.customers || []),
                  products: clone(json.products || []),
                  quotations: clone(json.quotations || [])
                };
              });
          }
          return statePromise;
        }

        function listMasters(state) {
          return state.quotations.map(function (item) { return item.master; });
        }

        function nextId(quotations) {
          var max = quotations.reduce(function (currentMax, item) {
            var match = String(item.master.id || "").match(/(\d+)$/);
            return Math.max(currentMax, match ? parseInt(match[1], 10) : 0);
          }, 0);
          return "BG-" + String(max + 1).padStart(3, "0");
        }

        function findQuotation(state, key) {
          return state.quotations.find(function (item) { return item.master.id === key; });
        }

        function snapshotDetails(state, quotationId, details, now) {
          return (details || []).map(function (detail, index) {
            var product = state.products.find(function (item) {
              return item.ma_hang === (detail.ma_hang || detail.hang_hoa_id);
            });
            var price = Number(detail.don_gia_chua_vat) || 0;
            return Object.assign({}, product || {}, detail, {
              id: detail.id || quotationId + "-D" + (index + 1),
              bao_gia_id: quotationId,
              line_no: index + 1,
              hang_hoa_id: product ? product.ma_hang : detail.hang_hoa_id,
              ma_hang: product ? product.ma_hang : detail.ma_hang,
              ma_sp: product ? product.ma_sp : detail.ma_sp,
              don_gia_goc_chua_vat: Number(product && product.don_gia_goc_chua_vat) || 0,
              vat_percent: Number(product && product.vat_percent) || 0,
              don_gia_chua_vat: price,
              don_gia_sau_vat: Math.round(price * (1 + (Number(product && product.vat_percent) || 0) / 100)),
              updatedAt: now
            });
          });
        }

        global._appScriptApi = function (functionName, payload) {
          payload = payload || {};
          return loadState().then(function (state) {
            var now = new Date().toISOString();

            switch (functionName) {
              case "Rpc.rpc_listBaoGiaMaster":
                return { ok: true, data: clone(listMasters(state)) };
              case "Rpc.rpc_listBaoGiaLookups":
                return {
                  ok: true,
                  data: clone({
                    customers: payload.scope === "products" ? [] : state.customers,
                    products: payload.scope === "customers" ? [] : state.products
                  })
                };
              case "Rpc.rpc_getBaoGia": {
                var found = findQuotation(state, payload.key);
                return found
                  ? { ok: true, data: clone(found) }
                  : { ok: false, error: { code: "notFound", message: "Không tìm thấy báo giá" } };
              }
              case "Rpc.rpc_createBaoGia": {
                var createdId = nextId(state.quotations);
                var createdMaster = Object.assign({}, payload.master || {}, {
                  id: createdId, createdAt: now, updatedAt: now,
                  print_file_id: "", print_file_name: "", print_file_url: "", print_created_at: null
                });
                var duplicate = state.quotations.some(function (item) {
                  return item.master.so_bao_gia.trim() === createdMaster.so_bao_gia.trim();
                });
                if (duplicate) {
                  return { ok: false, error: { code: "duplicateQuotationNumber", message: "Số báo giá đã tồn tại" } };
                }
                var created = {
                  master: createdMaster,
                  details: snapshotDetails(state, createdId, payload.details, now)
                };
                state.quotations.push(created);
                return { ok: true, data: clone(created) };
              }
              case "Rpc.rpc_updateBaoGia": {
                var updateIndex = state.quotations.findIndex(function (item) { return item.master.id === payload.key; });
                if (updateIndex < 0) {
                  return { ok: false, error: { code: "notFound", message: "Không tìm thấy báo giá" } };
                }
                var previous = state.quotations[updateIndex];
                var updatedMaster = Object.assign({}, previous.master, payload.master || {}, {
                  id: payload.key,
                  updatedAt: now,
                  print_file_id: previous.master.print_file_id || "",
                  print_file_name: previous.master.print_file_name || "",
                  print_file_url: previous.master.print_file_url || "",
                  print_created_at: previous.master.print_created_at || null
                });
                var updated = {
                  master: updatedMaster,
                  details: snapshotDetails(state, payload.key, payload.details, now)
                };
                state.quotations[updateIndex] = updated;
                return { ok: true, data: clone(updated) };
              }
              case "Rpc.rpc_deleteBaoGia": {
                var deleteIndex = state.quotations.findIndex(function (item) { return item.master.id === payload.key; });
                if (deleteIndex < 0) {
                  return { ok: false, error: { code: "notFound", message: "Không tìm thấy báo giá" } };
                }
                state.quotations.splice(deleteIndex, 1);
                return { ok: true, data: { id: payload.key } };
              }
              case "Rpc.rpc_generateBaoGiaPrint": {
                var quotation = findQuotation(state, payload.key);
                if (!quotation) {
                  return { ok: false, error: { code: "notFound", message: "Không tìm thấy báo giá" } };
                }
                var printResult = {
                  fileId: "MOCK-" + quotation.master.id,
                  fileName: "BG_" + quotation.master.so_bao_gia + "_local",
                  fileUrl: "https://drive.google.com/file/d/" + encodeURIComponent(quotation.master.id) + "/view",
                  createdAt: now
                };
                quotation.master.print_file_id = printResult.fileId;
                quotation.master.print_file_name = printResult.fileName;
                quotation.master.print_file_url = printResult.fileUrl;
                quotation.master.print_created_at = printResult.createdAt;
                return { ok: true, data: clone(printResult) };
              }
              default:
                return Promise.reject(new Error("Mock chưa hỗ trợ RPC: " + functionName));
            }
          });
        };

        loadState().then(function (state) {
          if (!global.__env) {
            global.__env = {
              production: false,
              currentUser: JSON.stringify({
                userId: "local-user",
                userName: "local",
                fullName: "Người dùng local",
                email: "local@example.com",
                permissions: []
              }),
              initData: JSON.stringify({ dataBaoGiaMaster: clone(listMasters(state)) })
            };
          }
        });
      })(window);
    </script>
  <link rel="stylesheet" href="styles.css"></head>
  <body class="dx-viewport">
    <app-root></app-root>
  <script src="runtime-es2015.js" type="module"></script><script src="runtime-es5.js" nomodule defer></script><script src="polyfills-es5.js" nomodule defer></script><script src="polyfills-es2015.js" type="module"></script><script src="main-es2015.js" type="module"></script><script src="main-es5.js" nomodule defer></script></body>
</html>
